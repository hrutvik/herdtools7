name: Build static binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'herdtools7 tag to build'
        required: true
        default: 'master'

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            host: ubuntu-latest
          - arch: arm64
            host: ubuntu-24.04-arm
    runs-on: ${{ matrix.host }}
    container:
      image: ocaml/opam:alpine-3.21-ocaml-5.2
      options: --platform linux/${{ matrix.arch }} --user root # GitHub Actions seems to require root
    env:
      OPAMROOT: '/home/opam/.opam' # Ensure opam directory is found as root
      OPAMROOTISOK: 1 # Suppress warnings about running opam as root

    name: Static binaries for ${{ matrix.arch }} at tag ${{ github.event.inputs.tag }}
    steps:

      - name: Checkout tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install prerequisites
        run: |
          apk add --quiet gmp-dev pkgconfig
          opam install . --deps-only

      - name: Enable verbose dune output
        run: |
          mkdir -p ~/.config/dune
          echo $'(lang dune 2.7)\n(display short)' > ~/.config/dune/config

      - name: Patch dune files
        run: |
          sed -i -e 's/(name asllib)/(name asllib)(no_dynlink)/g' asllib/dune
          sed -i -e 's/(name testhelpers)/(name testhelpers)(no_dynlink)/g' asllib/tests/dune

      - name: Build
        run: |
          mkdir /artifacts-${{ matrix.arch }}
          opam exec -- make build PREFIX=binaries DUNE_PROFILE=static
          opam exec -- make install PREFIX=/artifacts DUNE_PROFILE=static
          opam exec -- make build-aslref PREFIX=binaries DUNE_PROFILE=static
          opam exec -- make install-aslref PREFIX=/artifacts DUNE_PROFILE=static

      # NOTE: -set-libdir will need to be passed to various binaries, including `herd7` and `litmus7`
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            /artifacts-${{ matrix.arch }}/bin
            /artifacts-${{ matrix.arch }}/share
